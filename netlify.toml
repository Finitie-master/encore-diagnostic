[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/engine/*"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

# The premium diagnostic was reviewed at /preview/start before going live.
[[redirects]]
  from = "/preview/start/*"
  to = "/start/"
  status = 301
