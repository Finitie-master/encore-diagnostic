<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Encore Score™: 14 questions to show whether your next move stacks up commercially, practically and personally.">
<meta name="robots" content="noindex">
<title>The Encore Score™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
/* Layout: black dusk hero band, then a white panel with large rounded top corners (the site's signature), one question per screen. */
/* Brand-faithful, single light theme by choice, matching theencorepartnership.com. */
:root{
  --ink:#000000;
  --paper:#ffffff;
  --red:#DD1D13;
  --red-deep:#B8160E;
  --stone:#5F5C57;
  --mist:#EAEAE9;
  --fog:#F7F7F7;
  --char:#2B2B2B;
  --line:#D9D8D5;
  /* Production swaps these for Aperitif Serif / Neue Swiss (licensed) */
  --f-display:"Instrument Serif","Aperitif Serif Regular",Georgia,"Times New Roman",serif;
  --f-body:"Inter Tight","Neue Swiss Medium","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius-panel:56px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ink)}
body{margin:0;font-family:var(--f-body);color:var(--ink);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:880px;margin:0 auto}
.narrow{max-width:680px;margin:0 auto}

/* Top bar */
.topbar{background:var(--ink);color:var(--paper)}
.topbar .inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:22px}
.brand{display:flex;align-items:center;gap:12px;color:var(--paper);text-decoration:none}
.mark{display:block;fill:var(--red);height:26px;width:auto}
.hero .mark{height:40px;margin:0 auto 16px}
.brand span{font:700 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.toplink{font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--paper);text-decoration:none;opacity:.8}
.toplink:hover{opacity:1}

/* Hero band */
.hero{background:radial-gradient(120% 90% at 50% 0%,#6E5A43 0%,#3A2F25 38%,#0B0907 78%,#000 100%);color:var(--paper);text-align:center}
.hero .inner{padding-block:40px 120px}
.eyebrow{font:700 13px/1.4 var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.hero .eyebrow{color:var(--paper)}
.display{font-family:var(--f-display);font-weight:400;text-transform:uppercase;line-height:.95;letter-spacing:-.005em;text-wrap:balance;margin:0}
.hero h1{font-size:clamp(46px,9vw,96px);margin-top:14px}
.hero p.lede{max-width:560px;margin:22px auto 0;font-size:18px;color:#F2EEE8}
.meta{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 22px;margin-top:22px;font:400 13px/1.4 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#E2D9CC}

.btn{appearance:none;border:0;border-radius:0;cursor:pointer;font:400 16px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:14px 22px;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;transition:background .15s}
.btn-red{background:var(--red);color:var(--paper)}
.btn-red:hover{background:var(--red-deep)}
.btn-ghost{background:transparent;color:var(--ink);padding-left:0;padding-right:0}
.btn-ghost:hover{color:var(--red)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.hero .btn{margin-top:30px}

/* Panel */
.panel{background:var(--paper);border-radius:var(--radius-panel) var(--radius-panel) 0 0;margin-top:calc(-1 * var(--radius-panel));position:relative}
.panel>.inner{padding-block:64px 80px}
.panel.grey{background:var(--fog)}

/* Intro panel */
.intro-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.intro-grid h3{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.05;margin:8px 0 8px}
.intro-grid p{margin:0;font-size:16px;color:var(--char)}
.label-red{color:var(--red)}
.intro-note{margin-top:44px;padding-top:24px;border-top:1px solid var(--line);font-size:15px;color:var(--stone);max-width:640px}

/* Question screen */
.progress{display:flex;align-items:center;gap:16px;margin-bottom:44px}
.bar{flex:1;height:3px;background:var(--mist);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--red);transition:width .35s ease}
.count{font:400 13px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--stone);white-space:nowrap;font-variant-numeric:tabular-nums}
.q-title{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,5.2vw,52px);line-height:1.04;letter-spacing:-.01em;margin:12px 0 10px;text-wrap:balance}
.q-help{color:var(--stone);font-size:16px;margin:0 0 30px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:14px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);padding:14px 18px 14px 14px;cursor:pointer;font:500 17px/1.35 var(--f-body);color:var(--ink);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--ink)}
.opt .k{font:400 13px/1 var(--f-mono);color:var(--stone);border:1px solid var(--line);height:30px;display:grid;place-items:center}
.opt[aria-checked="true"]{border-color:var(--red);background:#FDF3F2}
.opt[aria-checked="true"] .k{background:var(--red);border-color:var(--red);color:var(--paper)}
.opt small{display:block;font:400 14px/1.4 var(--f-body);color:var(--stone);margin-top:2px}
textarea,input[type=text],input[type=email]{width:100%;font:500 18px/1.45 var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:0;padding:14px 16px}
textarea{min-height:120px;resize:vertical}
textarea:focus,input:focus{border-color:var(--ink);outline:none}
.nav{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:34px}
.field{display:grid;gap:8px;margin-bottom:18px}
.field label{font:700 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--char)}
.check input{margin-top:4px;accent-color:var(--red);width:18px;height:18px}
.err{color:var(--red);font-size:14px;min-height:20px}
.proto-note{font:400 12px/1.5 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--stone);background:var(--fog);padding:10px 12px;margin-top:8px}

/* Results */
.res-hero{background:var(--ink);color:var(--paper)}
.res-hero .inner{padding-block:40px 120px}
.res-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end}
.res-top .display{font-size:clamp(44px,8vw,88px);margin-top:14px}
.res-top .for{font-size:17px;color:#D8D4CE;margin-top:16px;max-width:520px}
.scorebox{text-align:right}
.scorebox .num{font-family:var(--f-display);font-size:clamp(88px,14vw,150px);line-height:.85;font-variant-numeric:tabular-nums}
.scorebox .num sup{font-size:.28em;vertical-align:top;margin-left:4px;color:#BDB7AE}
.scorebox .band{font:400 13px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-top:12px}
.scorebox .cap{font:700 11px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:#BDB7AE;margin-top:8px}

.scale{margin-top:44px}
.scale-track{display:grid;grid-template-columns:25fr 20fr 20fr 15fr 21fr;gap:3px;position:relative}
.scale-track div{height:6px;background:#3A3835}
.scale-track div.on{background:var(--red)}
.scale-labels{display:grid;grid-template-columns:25fr 20fr 20fr 15fr 21fr;gap:3px;margin-top:10px}
.scale-labels span{font:400 11px/1.3 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:#9C968D}
.scale-labels span.on{color:var(--paper)}
.marker{position:absolute;top:-7px;width:2px;height:20px;background:var(--paper);transform:translateX(-1px)}

.quote{font-family:var(--f-display);font-style:italic;font-size:24px;line-height:1.25;color:var(--char);border-left:2px solid var(--red);padding-left:18px;margin:0 0 30px}
.interp{font-size:19px;line-height:1.65;max-width:660px}
.interp p{margin:0 0 1em}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;margin-top:44px;background:var(--line);border:1px solid var(--line)}
.pair>div{background:var(--paper);padding:26px 26px 28px}
.pair h4{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.05;margin:10px 0 10px}
.pair p{margin:0;font-size:16px;color:var(--char)}
.pair .mini{font:400 13px/1 var(--f-mono);color:var(--stone);margin-top:16px;font-variant-numeric:tabular-nums}
.action{margin-top:28px;background:var(--fog);padding:28px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start}
.action .tag{font:400 12px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;background:var(--red);color:var(--paper);padding:8px 10px;white-space:nowrap}
.action p{margin:0;font-size:18px;font-weight:500}

.teaser h2{font-size:clamp(38px,6vw,64px)}
.teaser .lede{font-size:18px;color:var(--char);max-width:600px;margin:18px 0 0}
.locked{list-style:none;padding:0;margin:36px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px}
.locked li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:16px 0;border-top:1px solid var(--line);font-size:16px}
.locked li b{display:block;font-weight:700;font-size:16px}
.locked li span{color:var(--stone);font-size:15px}
.lock{width:14px;height:16px;margin-top:4px;position:relative}
.lock::before{content:"";position:absolute;left:2px;top:0;width:10px;height:9px;border:2px solid var(--red);border-bottom:0;border-radius:6px 6px 0 0}
.lock::after{content:"";position:absolute;left:0;bottom:0;width:14px;height:9px;background:var(--red)}
.buy{margin-top:40px;display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px}
.price{font-family:var(--f-display);font-size:56px;line-height:1}
.buy small{display:block;color:var(--stone);font-size:14px;max-width:340px}
.fine{margin-top:26px;font-size:14px;color:var(--stone);max-width:620px}

/* Prototype tools */
.proto{background:var(--char);color:#CFCAC2}
.proto .inner{padding-block:22px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.proto b{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--paper);margin-right:6px}
.chip{appearance:none;background:transparent;border:1px solid #57534E;color:#E6E1D9;font:400 12px/1 var(--f-mono);letter-spacing:.04em;padding:9px 11px;cursor:pointer;border-radius:0}
.chip:hover{border-color:var(--red);color:var(--paper)}

.hero-photo{background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.25) 45%,rgba(0,0,0,.2) 70%,rgba(0,0,0,.6) 100%),url(data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAPfBkADASIAAhEBAxEB/8QAGgABAQEBAQEBAAAAAAAAAAAAAAECAwQFBv/EABcBAQEBAQAAAAAAAAAAAAAAAAABAgP/2gAMAwEAAhADEAAAAfy4llAAAAAAAAAAAAAAAAAAAAAIACgBSAAACABaSwALBYAFgoIWEoliqgCKAAAKASgAAQVCgSiUgAQLKoAAAAJZQAAACKAAEIUAoAABKAiUBCgJQirKEsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAKAAAAACFKAhSALACoKlAEUIKlEshQihKEqgJULKBCoLAAoCUAEixaJRKBCpYJaAAEhYKBLCgJRKJQlKEiyhLBZaEKBLIqAAqpZSAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAALCgAAAgCyqllCAsAACwWCpQBKCUEKAIEKlqUEoEKQUJQAAELLCkFAAQohLBYqpQlEIssAFgoIoILFoIihFJQCgEsiywAFoQpAogAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAKlICwLKIAAAACgRQCWUAAlAlACUlCFJZQQqUSgAQoAAAAiKIUCkAIKqFIsgUELAWUEpSEsFgqKoEUJQAQsoSwAAAAAAAAAlAAAAAAAAAAAAAAAAAAAAAAAAAAIACgAAAAAALFCAAAAABZQAQpCkKQqCxSAqUIFgqCkLLCyiUACUAlAAQqCkixSWWpZSLBQAICwqAIUCWhCyhLIAAAWCyqhQgAAAAAAAAAAAACCWgAAAAAAABCgAAAAAAAAAAAAAAAAAAAAAAAFIAIAFBKCBSApKUEIACggAsoICrCKQqWoshYKlAqCAApYLLIFAEUEqkLFEAAIAsqoshYFKlASKgAWCxalgAAAAAAAAAAAAAAlAAAAAAABKAAAAAAAAAAAAAAAAAgAKCAAoAAAAAIWAKWAsKiFiiwWUQKCACALCggBZSCqBKIqBKqIFIqksgAAWkoASwAqUQCwCAKgLKCFlApKIqIAWosABSAAAAAAAJQAAAAAAAAAAAAAAAAAAAAAAAAAAIAACgAAgAKAAAAAFIIAAAoqFICwAhYFigAAgKCAFgCrCAFKggBSgEsAgACwAAAFgCggAAAKAWUSwqAAWIKAAAAAACAAoAQoAAAAAAAAAAAAAAAAAAAAAAAAAAgAKAAACAAoAAAAAIAAACrLIAAAAACgAAAgAUiwAAAWAABZSCgAgAAAAAAAKCAoICgAAgAAKAACAoAAAAICgAAAAAAAgKAAAAAAAAAAAAAAAAAAAACAAoAIACgAAAAAAgAKAAAsIAFIAKAAAACAAAAoIAAAWABYCyggAAAKACAoAAAAAAAAIAACgAAgKAAAAAAAAAAAAAAlAAAAAAAAAAAAAAAAAAAAAIACgAgAKAAAAAACAoICgAAAFQAAAAAAACAoIsKAFIsAgAWoAAIACgLAACAoAAIAACgAAgAAKAAAAAAAAAAAAAAAAAAQBQBKAAAAAAAAAAAAAAAAAAAgAKAAAAAAAACAAoICgAAAAAAAAAAAgAKFIAAAAABYAAgAKAAALAAAICggAAKCAAoIACggAKAAAAAAAAAAAAAAAhSWUAAAAAAAAAAAAAAAAAAAACAAoAAIA const PROFILES={
 unproven:{name:"The Unproven Expert",con:"V",
  text:["You bring serious raw material. Your experience is real, it is relevant, and people already recognise it. That is a genuine advantage.","What your answers don't show yet is evidence that buyers will pay for this particular offer. Right now the opportunity rests mainly on your judgement of what the market should need. Experienced professionals are especially prone to this, because their judgement has usually been right. The risk is spending months polishing a website, a brand or a programme for a problem nobody has confirmed in their own words.","The good news is that your credibility makes validation faster for you than for most. You can open doors others can't, so the next step is structured conversations rather than more preparation."],
  action:"Book five conversations in the next ten days with people who match your intended buyer. Ask about the problem and what they have already tried. Don't pitch your solution."},
 polished:{name:"The Polished Assumption",con:"V",
  text:["You have done real thinking about your offer. You can explain what you do, and it sounds credible. That clarity is valuable, but it can also mislead, because a well-articulated offer feels validated even when it hasn't been tested with buyers.","Your answers suggest the proposition is ahead of the evidence. You know what you want to sell, but you don't yet have enough proof that buyers see the problem the same way, or will pay to solve it.","Before you invest further in packaging, pricing pages or content, find out whether the market agrees with you. A short burst of direct conversations will either confirm you're on track or save you months on the wrong version."],
  action:"Show your one-sentence offer to three potential buyers and ask what problem they think it solves. If their answer doesn't match yours, the offer needs work before the marketing does."},
 untested:{name:"The Untested Idea",con:"V",
  text:["There is something here worth exploring, but at the moment it is mostly an idea rather than an opportunity. Your answers show gaps in the evidence that buyers have this problem and will pay to solve it.","That isn't a reason to stop. It is a reason to be careful about what you spend time and money on next. Most ventures don't fail because the founder lacked ability. They fail because the founder built first and asked later.","You have the chance to do it the other way round. A few weeks of focused discovery will tell you whether this idea deserves your next chapter, or whether a different angle on your experience would serve you better."],
  action:"Write down the three assumptions your idea depends on most. Then find two people outside your friends and former colleagues who could prove or disprove the first one."},
 revenue:{name:"Revenue Under Pressure",con:"RD",
  text:["You have valuable expertise and a clear need for income soon. That combination changes the order you should do things in.","Your answers suggest your runway and the pace you need revenue are pulling against each other. This is the moment many people make expensive mistakes, such as building a platform, a course or a brand that takes a year to pay back.","The right move is probably simpler and faster. Lead with a narrow, high-value service that draws on what you already know, sell it to people who already trust you, and let paid work show you where the repeatable demand is. Your bigger ambitions may well be viable. They just shouldn't be funded from a runway that is already under pressure."],
  action:"List ten people who already know your work and could buy, or introduce you to a buyer, in the next 60 days. Contact three of them this week."},
 economics:{name:"The Economic Mismatch",con:"M",
  text:["There may well be demand for what you do. The question is whether the business you're planning can deliver the life and income you want from it.","Your answers suggest the economics don't add up yet. That could be the price, the number of days you want to work, how the work is delivered, or the income target itself. When the maths doesn't work, more marketing makes things worse, because you end up busy and underpaid.","This is one of the most common patterns we see in experienced professionals, and one of the most fixable. It usually means changing the shape of the offer rather than the idea behind it: different packaging, a different price point, group or productised delivery, or a more realistic ramp-up."],
  action:"Divide your target annual income by your planned price per client or project. If the number of sales needed doesn't fit the days you want to work, change the model before you start selling."},
 chapter:{name:"The Wrong Next Chapter",con:"F",
  text:["Commercially, there may be a lot to like here. But your answers suggest the business you're considering may not fit the life you actually want.","That matters more than most diagnostics admit. Plenty of experienced people build something that works on paper and then find they have recreated the job they wanted to leave: the hours, the responsibility and the pressure, with less security.","Before you commit, get clear on what this next chapter is for and what you won't compromise on. The right answer may be a different model built on the same expertise, such as advisory or portfolio work rather than a full operating role."],
  action:"Write down three things you want your working week to include and three it must not include. Then check your current plan honestly against both lists."},
 rethink:{name:"Rethink Before Building",con:"C",
  text:["Your answers suggest the current idea has too many open questions to build on safely. The customer isn't yet clear, buyers haven't confirmed the problem, and the offer isn't sharp enough to test.","That is an uncomfortable result, but a useful one, and it says nothing about your ability. It means that pushing ahead now would probably spend time and money on a version of the business that isn't pointed at a real buyer with a real problem.","The better route is to start from what you know: which problems you have repeatedly solved, for whom, and which of those people feel the cost of leaving them unsolved. A clearer target usually emerges quickly once you start there."],
  action:"Write down three problems you have solved repeatedly in your career and who paid the price when they went unsolved. Pick the one with the most obvious buyer."},
 network:{name:"Network Without Focus",con:"C",
  text:["You have something many new businesses lack: access. Your network and reputation give you a route to people who could buy.","The risk is that the offer isn't focused enough yet to use that access well. Broad offers get polite interest from warm contacts and little else, and each lukewarm conversation uses goodwill you can't easily get back.","Narrow down before you reach out widely: one type of buyer, one situation that makes them look for help, and one outcome you can deliver. Once that is sharp, your network becomes a real commercial advantage rather than a list of people who like you."],
  action:"Describe your ideal first client in one sentence, including the moment that makes them look for help. Hold off on wider outreach until you can."},
 target:{name:"Value Without a Target",con:"C",
  text:["Your experience has real value, but it isn't yet pointed at a specific buyer with a specific problem.","This is very common when people move from a senior role into their own business, because a job title used to do the explaining. Without a clear target, everything downstream gets harder: pricing, messaging, finding prospects and standing out from generalist consultants and coaches.","The fix is to choose, for long enough to test. A narrow first focus doesn't limit your future business. It gives you the evidence to build one."],
  action:"Pick one type of organisation or person and one problem they pay to fix. Find five real examples of that buyer, by name, this week."},
 trapped:{name:"Value Trapped in Packaging",con:"P",

  action:"Rewrite your offer as one sentence that starts with the customer's outcome, not your background. Test it on two people who know nothing about your career."},
 distribution:{name:"Demand Without Distribution",con:"R",
  text:["You have done the hardest part. Your answers show genuine evidence that buyers want what you offer, and that is rarer than most people think.","Your constraint is reach. You don't yet have a reliable way to get in front of enough of the right people, consistently.","Avoid changing a validated offer just because sales are slow. The offer isn't the problem; distribution is. That means partnerships, introducers, targeted outreach and visible authority in the places your buyers already pay attention."],
  action:"List 20 people or organisations who already serve your buyers and could introduce you. Approach the first five this week with a specific, mutually useful proposal."},
 evidenced:{name:"The Evidenced Opportunity",con:null,
  text:["Your answers point to a business with real substance. You know who you serve, you have evidence they will pay, the offer is clear and the economics look sensible. That puts you ahead of most people at this stage.","The task now is disciplined execution rather than more research. Choose the few activities that turn evidence into revenue, and keep testing the assumptions that remain.","The biggest risk from here is usually distraction: building too much too early or chasing every adjacent opportunity. Your strongest area gives you momentum. Your weakest area is where the next round of attention should go."],
  action:"Set a 90-day revenue target and the three activities most likely to hit it. Defer anything that doesn't serve one of them."},
 broad:{name:"The Broad Foundation",con:"commercial-min",
  text:["You have a solid, balanced foundation with no single weakness that should stop you. That is a good position to be in.","The flip side is that nothing stands out strongly yet. Balanced profiles often mean the business is trying to serve too many people in too many ways.","The way forward is to narrow down. Choose the customer and problem where your evidence is strongest and build around that first. Focus lifts the scores that are currently just good enough, and makes everything from pricing to marketing easier. You can broaden later, once one part of the business is working and paying for the next."],
  action:"Look at your last ten professional wins. Find the type of client and problem that appears most often, and make that your first focus."}

function score(){
  const d={};
  Object.keys(DIMS).forEach(k=>{
    const items=Q.filter(q=>q.dim===k);
    const sum=items.reduce((t,q)=>t+(S.ans[q.id]??0),0);
    d[k]=Math.round(sum/(items.length*4)*100);
  });
  const overall=Math.round(Object.keys(DIMS).reduce((t,k)=>t+d[k]*DIMS[k].w,0));
  return {d,overall};
}
function band(n){return n>=80?"Strong":n>=65?"Promising":n>=45?"Unproven":n>=25?"Weak":"Critical"}
function profile(d,urgIdx){
  const urgent=urgIdx===0||urgIdx===1;
  if(d.F<40) return "chapter";
  if(d.C<40&&d.V<40&&d.P<45) return "rethink";
  if(d.RD<35&&urgent&&d.E>=70) return "revenue";
  if(d.V<55){ if(d.E>=75) return "unproven"; if(d.P>=70&&d.V<45) return "polished"; return "untested"; }
  if(d.M<45) return "economics";
  if(d.C<40) return d.R>=70?"network":"target";
  if(d.E>=75&&d.V>=60&&d.P<50) return "trapped";
  if(d.V>=70&&d.R<45) return "distribution";
  if(d.C>=70&&d.V>=70&&d.P>=70&&d.M>=70) return "evidenced";
  return "broad";
}
function strongest(d){
  return Object.keys(DIMS).sort((a,b)=>(d[b]-d[a])||(DIMS[b].w-DIMS[a].w))[0];
}
function constraintOf(pk,d){
  const c=PROFILES[pk].con;
  if(c==="commercial-min") return ["C","V","P","M"].sort((a,b)=>d[a]-d[b]||DIMS[b].w-DIMS[a].w)[0];
  if(c) return c;
  return Object.keys(DIMS).sort((a,b)=>(d[a]-d[b])||(DIMS[b].w-DIMS[a].w))[0];
}

function outcome(){
  const {d,overall}=score();
  const pk=profile(d,S.ans.urg);
  const st=strongest(d); let co=constraintOf(pk,d);
  if(co===st){ co=Object.keys(DIMS).filter(k=>k!==st).sort((a,b)=>d[a]-d[b])[0]; }
  return {d,overall,pk,st,co,band:band(overall)};
}
