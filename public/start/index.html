<style>
/* Paid diagnostic questionnaire: dark band, white panel with rounded top, one section per screen. */
:root{

}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--ink)}
body{margin:0;font-family:var(--f-body);color:var(--ink);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:820px;margin:0 auto}
.topbar .inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:22px;color:var(--paper)}
.brand{display:flex;align-items:center;gap:12px;color:var(--paper);text-decoration:none}
.mark{display:block;fill:var(--red);height:26px;width:auto}
.brand span{font:700 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.save{font:400 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#BDB7AE}
.hero{color:var(--paper)}
.hero .inner{padding-block:20px 100px}
.eyebrow{font:700 13px/1.4 var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.red{color:var(--red)}
.display{font-family:var(--f-display);font-weight:400;text-transform:uppercase;line-height:.95;margin:12px 0 0;font-size:clamp(40px,7vw,72px);text-wrap:balance}
.lede{color:#E2DDD6;max-width:600px;margin:18px 0 0}
.panel{background:var(--paper);border-radius:var(--radius-panel) var(--radius-panel) 0 0;margin-top:calc(-1*var(--radius-panel))}
.panel>.inner{padding-block:56px 90px}
.progress{display:flex;align-items:center;gap:16px;margin-bottom:36px}
.bar{flex:1;height:3px;background:var(--mist);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--red);transition:width .3s}

.sec-intro{color:var(--stone);font-size:16px;margin:0 0 30px}
.q{padding:24px 0;border-top:1px solid var(--line)}
.q label.qt,.q .qt{display:block;font-weight:600;font-size:18px;margin-bottom:14px}
.q .hint{display:block;font-weight:400;font-size:14px;color:var(--stone);margin-top:4px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:0;padding:10px 4px;cursor:pointer;font:500 14px/1.25 var(--f-body);color:var(--ink);display:grid;gap:4px;justify-items:center;text-align:center}
.scale button b{font:400 13px/1 var(--f-mono);color:var(--stone)}
.scale button:hover{border-color:var(--ink)}
.scale button[aria-checked="true"]{border-color:var(--red);background:#FDF3F2}
.scale button[aria-checked="true"] b{color:var(--red)}
.opts{display:grid;gap:8px}
.opts .opt{appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:0;padding:12px 16px;cursor:pointer;font:500 16px/1.35 var(--f-body);color:var(--ink);text-align:left}
.opts .opt:hover{border-color:var(--ink)}
.opts .opt[aria-checked="true"]{border-color:var(--red);background:#FDF3F2}
.opts .opt:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:0;padding:10px 14px;cursor:pointer;font:500 15px/1.3 var(--f-body);color:var(--ink)}
.choices button[aria-pressed="true"]{border-color:var(--red);background:#FDF3F2}
textarea,input[type=text],input[type=email],input[type=number]{width:100%;font:500 17px/1.45 var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:0;padding:12px 14px}

textarea:focus,input:focus{border-color:var(--ink);outline:none}
.btn{appearance:none;border:0;border-radius:0;cursor:pointer;font:400 16px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:14px 22px;display:inline-flex;align-items:center;gap:10px}
.btn-red{background:var(--red);color:var(--paper)}.btn-red:hover{background:var(--red-deep)}

.err{color:var(--red);font-size:15px;min-height:22px;margin-top:12px}

.small{font-size:14px}

.cf{margin-bottom:18px}.cf label{display:block;font-weight:600;font-size:16px;margin-bottom:8px}

.stat{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:baseline;margin-top:14px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:#D8D4CE;font-size:15px}
.meter{height:6px;background:#3A3835;margin-top:18px}.meter i{display:block;height:100%}
.meter i.fits{background:#7FB77E}.meter i.tight{background:#E0A43A}.meter i.does_not_fit{background:var(--red)}
.pill{display:inline-block;margin-top:12px;font:500 13px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:8px 10px;border:1px solid}
.pill.fits{color:#9FD39E;border-color:#5E8F5D}.pill.tight{color:#F0BF63;border-color:#9A7024}.pill.does_not_fit{color:#FF8A82;border-color:var(--red)}
.check{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--char);margin-top:14px}.check input{width:18px;height:18px;accent-color:var(--red)}
.log .entry{border:1px solid var(--line);padding:20px;margin-bottom:16px;display:grid;gap:12px}
.log .entry label{display:grid;gap:6px;font-weight:600;font-size:16px}
.log .entry .qt{font-weight:600;font-size:16px;margin:4px 0 0}
.btn.small{font-size:13px;padding:6px 0}
.cf .hint,.log .hint,.calc .hint{display:block;font-weight:400;font-size:14px;color:var(--stone);margin-top:4px;line-height:1.45}

.cf input::placeholder{color:#B5B0A8;opacity:1}
.demo-bar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;background:#141414;color:#EDE7DE;font-size:14px;box-shadow:0 -4px 16px rgba(0,0,0,.2)}
.demo-tag{background:var(--red);color:#fff;font:600 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 8px}
.demo-txt{margin-right:auto}
.demo-bar select,.demo-bar button{font:inherit;font-size:14px;padding:6px 10px;border:1px solid #555;background:#222;color:#EDE7DE;cursor:pointer}
.demo-bar button:hover,.demo-bar select:hover{border-color:#aaa}
body.is-demo{padding-bottom:72px}
.demo-h{font-family:var(--f-display);font-weight:400;font-size:28px;margin:28px 0 10px}
.demo-t{width:100%;border-collapse:collapse;font-size:15px}.demo-t th{text-align:left;vertical-align:top;width:180px;padding:10px 12px 10px 0;border-top:1px solid var(--line);font-weight:600}.demo-t td{padding:10px 0;border-top:1px solid var(--line)}
@media (max-width:640px){.demo-txt{display:none}.demo-t th{width:110px}}
</style>
</head>

  if(it.s){
    const v=A[it.s], Q=QMAP[it.s];
    return `<div class="q"><span class="qt" id="l-${it.s}">${esc(Q.text)}</span><div class="opts" role="radiogroup" aria-labelledby="l-${it.s}">${Q.options.map((l,i)=>`<button type="button" class="opt" role="radio" aria-checked="${v===i}" data-s="${it.s}" data-v="${i}">${esc(l)}</button>`).join("")}</div></div>`;
  }
  if(it.calc) return calcHTML();
  if(it.log) return logHTML();
  if(it.type==="choice"||it.type==="multi"){
    const v=A[it.c]; const sel=o=>it.type==="multi"?(Array.isArray(v)&&v.includes(o)):v===o;
    return `<div class="q"><span class="qt">${esc(it.q)}${it.hint?`<span class="hint">${esc(it.hint)}</span>`:""}${it.type==="multi"?`<span class="hint">Choose any that apply.</span>`:""}</span><div class="choices">${it.opts.map(o=>`<button type="button" aria-pressed="${sel(o)}" data-c="${it.c}" data-o="${esc(o)}" data-m="${it.type==="multi"?1:0}">${esc(o)}</button>`).join("")}</div></div>`;
  }
  const id="f-"+it.c, val=esc(A[it.c]||"");
  return `<div class="q"><label class="qt" for="${id}">${esc(it.q)}${it.hint?`<span class="hint">${esc(it.hint)}</span>`:""}</label>${it.type==="long"?`<textarea id="${id}" data-c="${it.c}">${val}</textarea>`:`<input id="${id}" type="${it.type==="email"?"email":"text"}" data-c="${it.c}" value="${val}" ${it.type==="email"?'autocomplete="email"':it.c==="name"?'autocomplete="name"':""}>`}</div>`;
}

function calcHTML(){
  const f=(c,label,hint,pre,ex)=>`<div class="cf"><label for="f-${c}">${label}${hint?`<span class="hint">${hint}</span>`:""}</label><div class="pre">${pre?`<span>${pre}</span>`:""}<input type="number" inputmode="decimal" min="0" step="any" id="f-${c}" data-c="${c}" placeholder="${ex}" value="${esc(A[c]??"")}"></div></div>`;
  return `<div class="calc">
    <div class="cinputs">
      ${f("econ_income","The annual income you want the business to pay you","Before personal tax. Your answer in section 1 was "+esc(A.income||"not given")+".","£","e.g. 60000")}
      ${f("econ_costs","Your yearly business costs","Software, insurance, travel, accountant, marketing. A rough guess is fine.","£","e.g. 8000")}
      ${f("econ_price","The price of your main offer, per client or project","What one sale would bring in.","£","e.g. 6000")}
      ${f("econ_days","Delivery days each sale takes","Including preparation and follow-up.","","e.g. 6")}
      <p class="hint">Working ${daysPerWeek()||"?"} day${daysPerWeek()===1?"":"s"} a week (from section 1), 44 weeks a year, with about 30% of your time going on selling and admin.</p>
      <label class="check"><input type="checkbox" id="econ_unknown" ${A.econ_unknown?"checked":""}> I can't estimate these yet</label>
    </div>
    <div class="cout" id="cout" aria-live="polite"></div>
  </div>`;
}
function updateCalc(){
  const out=document.getElementById("cout"); if(!out) return;
  const r=economics(econInputs());
  if(!r.complete){out.innerHTML=`<div class="mono small">Your numbers</div><p class="big">Fill in your income, price and days per sale to see what they mean.</p>`;return;}
  const label={fits:"Fits",tight:"Tight",does_not_fit:"Doesn't add up"}[r.status];
  out.innerHTML=`<div class="mono small">Your numbers</div>
    <div class="stat"><b>${r.salesNeeded}</b><span>sales a year (about ${r.salesPerMonth} a month) to bring in ${fmt(r.revenueNeeded)}</span></div>
    <div class="stat"><b>${r.deliveryDaysNeeded}</b><span>delivery days needed, out of about ${r.deliveryDaysAvailable} available</span></div>
    <div class="meter"><i class="${r.status}" style="width:${Math.min(100,r.capacityPct)}%"></i></div>
    <div class="pill ${r.status}">${label} · ${r.capacityPct}% of your delivery time</div>
    <p class="small">${esc(STATUS_TEXT[r.status])}</p>
    ${r.status!=="fits"?`<p class="small">To fit comfortably, each sale would need to bring in about <b>${fmt(r.priceThatFits)}</b>.</p>`:""}`;
}

function logHTML(){
  const L=Array.isArray(A.log)&&A.log.length?A.log:[{}];
  return `<div class="log">${L.map((e,i)=>`<div class="entry" data-i="${i}">
     <div class="mono small red">Conversation ${i+1}</div>
     <label>Who was it?<span class="hint">Their role and type of organisation, not their name. For example: "Founder, 40-person design agency".</span><input type="text" data-l="${i}" data-k="who" value="${esc(e.who||"")}"></label>
     <span class="qt">How do you know them?</span><div class="choices">${REL.map(o=>`<button type="button" aria-pressed="${e.rel===o}" data-l="${i}" data-k="rel" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
     <label>What problem did they describe, in their words?<textarea data-l="${i}" data-k="problem">${esc(e.problem||"")}</textarea></label>
     <span class="qt">Did money come up?</span><div class="choices">${MONEY.map(o=>`<button type="button" aria-pressed="${e.money===o}" data-l="${i}" data-k="money" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
     ${L.length>1?`<button type="button" class="btn btn-ghost small" data-remove="${i}">Remove this conversation</button>`:""}
   </div>`).join("")}
   ${L.length<5?`<button type="button" class="btn btn-ghost" id="addlog">+ Add another conversation</button>`:""}
   <label class="check"><input type="checkbox" id="log_none" ${A.log_none?"checked":""}> I haven't had any conversations like this yet</label></div>`;
}
function logSummary(){
  const L=(A.log||[]).filter(e=>e.who||e.problem);
  const outside=L.filter(e=>REL.indexOf(e.rel)>=3).length;
  const money=L.filter(e=>MONEY.indexOf(e.money)>=1).length;
  const paid=L.filter(e=>MONEY.indexOf(e.money)>=3).length;
  return {count:L.length,outsideNetwork:outside,moneyDiscussed:money,committedOrPaid:paid,none:!!A.log_none,
    text:A.log_none&&!L.length?"No buyer conversations yet.":`${L.length} conversation(s); ${outside} outside their own network; money discussed in ${money}; commitment or payment in ${paid}.`};
}

function render(){ if(step<0) return renderWelcome(); renderSection(); }
function renderSection(){
  const S=SECTIONS[step];
  const left=Math.max(1,Math.round((N-step)*3));
  let html=`<div class="progress"><div class="bar"><i style="width:${Math.round(step/N*100)}%"></i></div><span class="count">Section ${step+1} of ${N} · about ${left} min left</span></div>
  <div class="eyebrow red">Section ${step+1}</div><h2 class="sec">${esc(S.title)}</h2><p class="sec-intro">${esc(S.intro)}</p>`;
  if(S.items.some(i=>i.s)) html+=`<p class="note">Choose the answer closest to how things are today, not how you hope they'll be.</p>`;
  html+=S.items.map(itemHTML).join("");
  html+=`<div class="err" id="err" role="alert"></div><div class="nav"><button class="btn btn-ghost" id="back">← Back</button><button class="btn btn-red" id="next">${step===N-1?"Submit my diagnostic":"Next section"} →</button></div>`;
  app.innerHTML=html; window.scrollTo({top:0});
  bind(S);
}
function bind(S){
  app.querySelectorAll(".opts .opt").forEach(b=>b.onclick=()=>{A[b.dataset.s]=+b.dataset.v;save();b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-checked",x===b));});
  app.querySelectorAll(".choices button[data-c]").forEach(b=>b.onclick=()=>{
    const c=b.dataset.c,o=b.dataset.o;
    if(b.dataset.m==="1"){const arr=Array.isArray(A[c])?A[c]:[];A[c]=arr.includes(o)?arr.filter(x=>x!==o):[...arr,o];b.setAttribute("aria-pressed",A[c].includes(o));}
    else{A[c]=o;b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));}
    save();
  });
  app.querySelectorAll("input[data-c],textarea[data-c]").forEach(f=>f.oninput=()=>{A[f.dataset.c]=f.type==="number"?(f.value===""?"":+f.value):f.value;save();updateCalc();});
  const eu=document.getElementById("econ_unknown"); if(eu) eu.onchange=()=>{A.econ_unknown=eu.checked;save();};
  // evidence log
  if(!Array.isArray(A.log)||!A.log.length) A.log=[{}];
  app.querySelectorAll("[data-l]").forEach(el=>{
    const i=+el.dataset.l,k=el.dataset.k;
    if(el.tagName==="BUTTON") el.onclick=()=>{A.log[i][k]=el.dataset.o;save();el.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===el));};
    else el.oninput=()=>{A.log[i][k]=el.value;save();};
  });
  const add=document.getElementById("addlog"); if(add) add.onclick=()=>{A.log.push({});save();renderSection();};
  app.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{A.log.splice(+b.dataset.remove,1);save();renderSection();});
  const ln=document.getElementById("log_none"); if(ln) ln.onchange=()=>{A.log_none=ln.checked;save();};
  updateCalc();
  document.getElementById("back").onclick=()=>{step--;save();render();};
  document.getElementById("next").onclick=()=>{
    if(DEMO){ if(step<N-1){step++;save();render();} else submit(); return; }
    const err=document.getElementById("err");
    const missing=S.items.filter(it=>it.s?A[it.s]===undefined:(it.req&&!String(A[it.c]||"").trim()));
    if(missing.length){err.textContent=`Please answer every question${S.items.some(i=>i.req)?" and required item":""} in this section before moving on (${missing.length} left).`;return;}
    if(S.items.some(i=>i.c==="email")&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(A.email||"")){err.textContent="Please enter a valid email address, for example jo@example.com.";return;}
    if(S.items.some(i=>i.calc)&&!A.econ_unknown&&!economics(econInputs()).complete){err.textContent="Please fill in your income, price and delivery days, or tick “I can't estimate these yet”.";return;}
    if(S.items.some(i=>i.log)&&!A.log_none&&!(A.log||[]).some(e=>(e.who||"").trim()&&(e.problem||"").trim())){err.textContent="Please describe at least one conversation (who it was and the problem they described), or tick “I haven't had any conversations like this yet”.";return;}
    if(step<N-1){step++;save();render();} else submit();
  };
}

function computeAll(){
  const answers={}; QUESTIONS.forEach(q=>answers[q.code]=A[q.code]);
  const r=evaluate({answers,urgency:A.urgency});
  const econ=A.econ_unknown?{complete:false}:economics(econInputs());
  const ev=logSummary();
  const mf=modelFit({dims:r.dimensions,urgency:A.urgency,prefs:{work_mode:A.work_mode,engagement:A.engagement,client_count:A.client_count,groups:A.groups,accountability:A.accountability,avoid:A.avoid},answers,relationships:A.relationships,econStatus:econ.status});
  const why=m=>m.reasons.slice(0,3).map(x=>x.why).join(" ");
  const modelText=`Primary: ${mf.primary.name} (${mf.primary.score}). ${why(mf.primary)}`+(mf.secondary?` | Secondary: ${mf.secondary.name} (${mf.secondary.score}). ${why(mf.secondary)}`:"")+` | Least suitable: ${mf.rejected.map(m=>`${m.name} (${m.score})`).join(", ")}.`;
  const econText=econ.complete?`${econ.salesNeeded} sales a year at ${fmt(+A.econ_price)}; ${econ.deliveryDaysNeeded} of ${econ.deliveryDaysAvailable} delivery days (${econ.capacityPct}%); ${econ.status}; price that fits ≈ ${fmt(econ.priceThatFits)}`:"Not estimated";
  const context={}; SECTIONS.forEach(S=>S.items.forEach(it=>{if(it.c) context[it.c]=A[it.c];}));
  Object.assign(context,{econ_income:A.econ_income,econ_costs:A.econ_costs,econ_price:A.econ_price,econ_days:A.econ_days,econ_unknown:!!A.econ_unknown});
  const f={"form-name":FORM_NAME,"bot-field":"",name:A.name,email:A.email,proposed_business:A.building||"",
    verdict:r.verdict.label,overall:String(r.overall),
    dimension_scores:Object.keys(DIMENSIONS).map(k=>DIMENSIONS[k].name+": "+r.dimensions[k]).join("; "),
    gates:r.gates.join(", "),patterns:r.patterns.map(k=>k+" "+r.patternDetail[k].name).join("; "),
    economics:econText,evidence_summary:ev.text,model_fit:modelText,
    answers_json:JSON.stringify(answers),context_answers:JSON.stringify(context),
    evidence_log:JSON.stringify((A.log||[]).filter(e=>e.who||e.problem)),
    profile_text:A.profile_text||"",offer_text:A.offer_text||""};
  return {f,r,econText,ev,modelText};
}
async function submit(){
  if(DEMO){ let o=null; try{o=computeAll();}catch(e){} return demoDone(o); }
  const {f}=computeAll();
  const btn=document.getElementById("next"); btn.disabled=true; btn.textContent="Sending…";
  try{
    const res=await fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(f).toString()});
    if(!res.ok) throw new Error(res.status);
    try{localStorage.removeItem(KEY);}catch(e){}
    app.innerHTML=`<div class="done"><div class="eyebrow red">Diagnostic received</div><h2>Thank you, ${esc((A.name||"").split(" ")[0])}.</h2>
    <p>Your answers are in. Your Encore Verdict will arrive at <b>${esc(A.email)}</b> within 24 hours.</p>
    <p class="note">While you wait, there's one thing worth doing: write down the single assumption that, if it turned out to be wrong, would change your plan most. Your Verdict will tell you whether you picked the right one.</p></div>`;
    window.scrollTo({top:0});
  }catch(e){
    btn.disabled=false; btn.textContent="Try again →";
    document.getElementById("err").textContent="Your answers didn't send. Your progress is saved on this device; please check your connection and try again. If it keeps failing, email jo@theencorepartnership.com.";
  }
}

// ---------- Demo mode ----------
function demoDone(o){
  const ok=o&&Number.isFinite(+o.f.overall)&&QUESTIONS.every(q=>A[q.code]!==undefined);
  const row=(k,v)=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`;
  app.innerHTML=`<div class="done"><div class="eyebrow red">Demo complete</div><h2>That's the end of the diagnostic.</h2>
  <p>In demo mode nothing is submitted, so no email is sent and nothing reaches Jo's inbox. A real client would now see: <i>"Your Encore Verdict will arrive within 24 hours."</i></p>
  ${ok?`<h3 class="demo-h">What Jo receives to write the Verdict</h3><table class="demo-t">
    ${row("Verdict",o.f.verdict)}${row("Overall score",o.f.overall+" / 100")}${row("Dimension scores",o.f.dimension_scores)}
    ${row("Gates triggered",o.f.gates||"None")}${row("Patterns",o.f.patterns||"None")}${row("Numbers",o.econText)}
    ${row("Evidence log",o.ev.text)}${row("Business model fit",o.modelText)}</table>`
    :`<p class="note">Some scored questions were left blank, so there's no computed summary to show. Use "Fill sample answers" in the demo bar to see a full example.</p>`}
  <div class="nav"><button class="btn btn-ghost" id="d-back">← Back to the last section</button><button class="btn btn-red" id="d-new">Start a fresh demo</button></div></div>`;
  window.scrollTo({top:0});
  document.getElementById("d-back").onclick=()=>{step=N-1;save();render();};
  document.getElementById("d-new").onclick=()=>{A={};step=-1;save();render();};
}
function demoSample(){
  const pick=(c,i)=>{const it=SECTIONS.flatMap(S=>S.items).find(x=>x.c===c);return it&&it.opts?it.opts[Math.min(i,it.opts.length-1)]:undefined;};
  A={name:"David Example",email:"david@example.com",
    situation:pick("situation",1),purpose:pick("purpose",0),income:pick("income",2),urgency:pick("urgency",1),days:pick("days",2),
    building:"An operations consultancy helping founders of growing B2B service firms stop losing clients between the sale and the delivery.",
    problems:"Onboarding chaos after a big sale; handovers between sales and delivery; teams that have outgrown their processes.",
    evidence_expertise:"22 years in operations across three companies. Cut client-onboarding errors by 40% and led two post-acquisition integrations.",
    customer:"Founders and MDs of B2B service firms with 30 to 150 staff who are growing faster than their processes.",
    do_nothing:"They keep losing clients in the first 90 days and burning out their best people.",
    best_evidence:"Two former colleagues said they would love help with their onboarding, but nobody has talked about paying yet.",
    offer:"A six-week onboarding fix: diagnose, redesign and embed a new client onboarding process.",
    different:"I've done this inside three businesses, not just advised on it.",
    first_sale:"A former colleague who is now MD of a 60-person agency.",
    relationships:pick("relationships",3),channels:[pick("channels",0),pick("channels",5),pick("channels",2)],
    funding:[pick("funding",1),pick("funding",0)],invest_max:pick("invest_max",1),
    work_mode:pick("work_mode",0),engagement:pick("engagement",1),client_count:pick("client_count",1),groups:pick("groups",0),
    delivery:pick("delivery",2),accountability:pick("accountability",2),selling:[pick("selling",0),pick("selling",1)],avoid:[pick("avoid",0),pick("avoid",5)],
    success_beyond_money:"Doing work I'm proud of, three days a week, with time for family.",
    no_compromise:"I won't go back to a full-time role with a long commute.",
    econ_income:60000,econ_costs:8000,econ_price:6000,econ_days:6,
    log:[{who:"MD, 60-person digital agency",rel:REL[1],problem:"New clients churn because delivery doesn't match what sales promised.",money:MONEY[0]},
         {who:"Founder, 40-person design studio",rel:REL[2],problem:"Onboarding takes six weeks and clients get nervous.",money:MONEY[0]}]};
  // A coherent example: strong expertise, thin evidence of willingness to pay (The Unproven Expert, verdict Validate First).
  const SAMPLE={B1:3,B2:3,B3:3,B4:3,B5:3,C1:2,C2:3,C3:3,C4:1,C5:2,C6:3,D1:2,D2:2,D3:1,D4:0,D5:3,D6:2,D7:1,
    E1:2,E2:3,E3:3,E4:2,E5:2,F1:2,F2:2,F3:3,F4:3,F5:2,F6:3,G1:3,G2:3,G3:2,G4:2,G5:2,H1:2,H2:3,H3:2,H4:3,H5:3,I1:3,I2:3,I3:2,I4:3};
  QUESTIONS.forEach(q=>{A[q.code]=SAMPLE[q.code]??2;});
}
function demoBar(){
  if(!DEMO) return;
  const bar=document.createElement("div"); bar.className="demo-bar no-print";
  bar.innerHTML=`<span class="demo-tag">Demo mode</span><span class="demo-txt">Nothing is required and nothing is submitted.</span>
    <select id="d-jump" aria-label="Jump to section"><option value="">Jump to…</option><option value="-1">Welcome</option>${SECTIONS.map((S,i)=>`<option value="${i}">${i+1}. ${esc(S.title)}</option>`).join("")}</select>
    <button type="button" id="d-fill">Fill sample answers</button><button type="button" id="d-clear">Clear answers</button><button type="button" id="d-exit">Exit demo</button>`;
  document.body.appendChild(bar); document.body.classList.add("is-demo");
  bar.querySelector("#d-jump").onchange=e=>{if(e.target.value==="")return;step=+e.target.value;save();render();e.target.value="";};
  bar.querySelector("#d-fill").onclick=()=>{demoSample();save();render();};
  bar.querySelector("#d-clear").onclick=()=>{A={};save();render();};
  bar.querySelector("#d-exit").onclick=()=>{try{sessionStorage.removeItem("encore-demo");localStorage.removeItem("encore-diagnostic-demo");}catch(e){} location.href="/start/";};
}
demoBar();
render();
</script>
</body>
</html>
