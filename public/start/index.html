<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Encore Diagnostic™ | The Encore Partnership</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
/* Paid diagnostic questionnaire: dark band, white panel with rounded top, one section per screen. */
:root{
  --ink:#000;--paper:#fff;--red:#DD1D13;--red-deep:#B8160E;--stone:#5F5C57;--mist:#EAEAE9;--fog:#F7F7F7;--char:#2B2B2B;--line:#D9D8D5;
  --f-display:"Instrument Serif","Aperitif Serif Regular",Georgia,serif;
  --f-body:"Inter Tight","Neue Swiss Medium","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius-panel:56px;color-scheme:light;
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--ink)}
body{margin:0;font-family:var(--f-body);color:var(--ink);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:820px;margin:0 auto}
.topbar .inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:22px;color:var(--paper)}
.brand{display:flex;align-items:center;gap:12px;color:var(--paper);text-decoration:none}
.mark{display:block;fill:var(--red);height:26px;width:auto}
.brand span{font:700 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.save{font:400 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#BDB7AE}
.hero{color:var(--paper)}
.hero .inner{padding-block:20px 100px}
.eyebrow{font:700 13px/1.4 var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.red{color:var(--red)}
.display{font-family:var(--f-display);font-weight:400;text-transform:uppercase;line-height:.95;margin:12px 0 0;font-size:clamp(40px,7vw,72px);text-wrap:balance}
.lede{color:#E2DDD6;max-width:600px;margin:18px 0 0}
.panel{background:var(--paper);border-radius:var(--radius-panel) var(--radius-panel) 0 0;margin-top:calc(-1*var(--radius-panel))}
.panel>.inner{padding-block:56px 90px}
.progress{display:flex;align-items:center;gap:16px;margin-bottom:36px}
.bar{flex:1;height:3px;background:var(--mist);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--red);transition:width .3s}
.count{font:400 13px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--stone);white-space:nowrap}
h2.sec{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,5vw,50px);line-height:1.04;margin:10px 0 8px;text-wrap:balance}
.sec-intro{color:var(--stone);font-size:16px;margin:0 0 30px}
.q{padding:24px 0;border-top:1px solid var(--line)}
.q label.qt,.q .qt{display:block;font-weight:600;font-size:18px;margin-bottom:14px}
.q .hint{display:block;font-weight:400;font-size:14px;color:var(--stone);margin-top:4px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:0;padding:10px 4px;cursor:pointer;font:500 14px/1.25 var(--f-body);color:var(--ink);display:grid;gap:4px;justify-items:center;text-align:center}
.scale button b{font:400 13px/1 var(--f-mono);color:var(--stone)}
.scale button:hover{border-color:var(--ink)}
.scale button[aria-checked="true"]{border-color:var(--red);background:#FDF3F2}
.scale button[aria-checked="true"] b{color:var(--red)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:0;padding:10px 14px;cursor:pointer;font:500 15px/1.3 var(--f-body);color:var(--ink)}
.choices button[aria-pressed="true"]{border-color:var(--red);background:#FDF3F2}
textarea,input[type=text],input[type=email],input[type=number]{width:100%;font:500 17px/1.45 var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:0;padding:12px 14px}
textarea{min-height:96px;resize:vertical}
textarea:focus,input:focus{border-color:var(--ink);outline:none}
.btn{appearance:none;border:0;border-radius:0;cursor:pointer;font:400 16px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:14px 22px;display:inline-flex;align-items:center;gap:10px}
.btn-red{background:var(--red);color:var(--paper)}.btn-red:hover{background:var(--red-deep)}
.btn-ghost{background:transparent;color:var(--ink);padding-left:0;padding-right:0}
.btn:focus-visible,.scale button:focus-visible,.choices button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:32px}
.err{color:var(--red);font-size:15px;min-height:22px;margin-top:12px}
.note{background:var(--fog);padding:18px 20px;font-size:15px;color:var(--char)}
.done h2{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,6vw,60px);line-height:1;margin:12px 0 16px}
@media (max-width:640px){:root{--radius-panel:32px}.scale{grid-template-columns:repeat(5,minmax(0,1fr))}.scale button{font-size:11px;padding:8px 2px}}
</style>
</head>
<body>
<header class="topbar wrap"><div class="inner">
  <a class="brand" href="https://theencorepartnership.com"><svg class="mark" viewBox="0 0 930 1236" aria-hidden="true"><rect x="2" y="1" width="926" height="165"/><path d="M146 291h652v155H326v212h434v154H326v268h472v155H146z"/></svg><span>The Encore Partnership™</span></a>
  <span class="save" id="saved">Progress saved on this device</span>
</div></header>

<section class="hero wrap"><div class="inner">
  <div class="eyebrow red">The Encore Diagnostic™</div>
  <h1 class="display">Your diagnostic questions</h1>
  <p class="lede">Nine short sections, about 20 to 30 minutes. Answer as things are today, not as you hope they'll be. Your progress is saved on this device, so you can stop and come back.</p>
</div></section>

<section class="panel wrap"><div class="inner" id="app"></div></section>

<form name="encore-diagnostic" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="name"><input name="email"><input name="proposed_business">
  <input name="verdict"><input name="overall"><input name="dimension_scores"><input name="gates"><input name="patterns">
  <textarea name="answers_json"></textarea><textarea name="context_answers"></textarea>
</form>

<script type="module">
import { QUESTIONS, } from "/engine/questions.mjs";
import { evaluate, DIMENSIONS } from "/engine/scoring.mjs";

// Full wording from the working blueprint, keyed by harness code.
const TEXT = {
  B1:"I can identify specific problems I have repeatedly solved during my career.",
  B2:"Other people already seek my advice or expertise in these areas.",
  B3:"I can point to measurable outcomes or results my work has created.",
  B4:"My expertise is current enough to be commercially relevant now.",
  B5:"I can explain my most valuable expertise without relying on my former job title.",
  C1:"I can describe the specific type of person or organisation most likely to buy from me.",
  C2:"I understand the situation or trigger that would make this customer look for help.",
  C3:"The problem I intend to solve has meaningful financial, operational or personal consequences if left unresolved.",
  C4:"My target customer already spends money trying to solve this problem or an adjacent one.",
  C5:"I know who normally makes or influences the buying decision.",
  C6:"My target market is currently best described as 'anyone who could benefit from my experience'.",
  D1:"I have spoken directly to at least 10 plausible target customers about this problem.",
  D2:"Those conversations confirmed the problem in the customers' own words, rather than simply positive reactions to my idea.",
  D3:"I have evidence that people will pay, not merely that they like the concept.",
  D4:"I have already generated revenue, a paid pilot, a deposit, a letter of intent or an equivalent commitment for this or a close version.",
  D5:"I understand the alternatives customers currently use, including doing nothing.",
  D6:"I have tested my assumptions with people outside my immediate friends and supportive professional network.",
  D7:"Most of my confidence in the opportunity comes from my own experience and belief that the market should need it.",
  E1:"I can explain what I sell in one or two sentences without giving my career history first.",
  E2:"The proposition describes a customer outcome, not simply access to my expertise.",
  E3:"A prospective customer could understand why they should choose me rather than a general consultant, coach or freelancer.",
  E4:"The scope of the offer is specific enough to price and deliver consistently.",
  E5:"I have a credible reason for the customer to act now rather than 'sometime'.",
  F1:"I know how the business will make money and what customers will actually buy.",
  F2:"My proposed price is based on customer value and market evidence rather than what feels comfortable to charge.",
  F3:"The likely number of customers required to reach my income target is realistic.",
  F4:"The model can be delivered within the number of days I want to work.",
  F5:"I understand the direct costs and major overheads involved.",
  F6:"The model does not depend on a large audience, team or technology build before I can make the first meaningful sale.",
  G1:"I already have relationships with people who resemble my intended customers or can introduce me to them.",
  G2:"I have a credible professional profile that supports the proposition I want to sell.",
  G3:"I know where my target customers gather, learn, buy or seek recommendations.",
  G4:"I am willing and able to have direct commercial conversations rather than relying entirely on content or referrals.",
  G5:"I have at least one realistic route to my first 10 customers.",
  H1:"I have protected time each week to develop and sell the business.",
  H2:"I have sufficient financial runway to validate the idea without making desperate short-term decisions.",
  H3:"I have identified how much I am prepared to invest before requiring evidence of traction.",
  H4:"My household and personal financial commitments are compatible with the likely ramp-up period.",
  H5:"I need the business to replace a substantial salary almost immediately.",
  I1:"I genuinely want to run a business, rather than feeling self-employment is my only remaining option.",
  I2:"The day-to-day work involved in this business is work I actually want to do.",
  I3:"I am prepared to sell, test, adapt and hear that some of my assumptions are wrong.",
  I4:"The business I am considering fits the life I want over the next five years.",
};
const SCALE = ["Not at all","Slightly","Partly","Mostly","Strongly"];

// Sections: context (c) and scored (s) items, in blueprint order.
const SECTIONS = [
 { title:"About you and your next move", intro:"First, the basics, and what you want this business to do for you.", items:[
   {c:"name",type:"text",q:"Your full name",req:true},
   {c:"email",type:"email",q:"The email address you used at checkout",hint:"We'll send your Encore Verdict here.",req:true},
   {c:"situation",type:"choice",q:"Which best describes where you are now?",opts:["Redundant","Employed but planning to leave","Retired or semi-retired","Previous business ended or sold","Already consulting","Other"],req:true},
   {c:"building",type:"long",q:"What are you considering building?",hint:"A rough description is fine. If you came from the workshop, paste your next move statement.",req:true},
   {c:"purpose",type:"choice",q:"What do you want this business to do for you?",opts:["Primary income","Meaningful supplementary income","Portfolio career","Lifestyle business","Build an asset","Not sure"],req:true},
   {c:"income",type:"choice",q:"What annual personal income would you ideally like it to provide within 2 to 3 years?",opts:["Under £30k","£30k–£60k","£60k–£100k","£100k–£150k","£150k+"],req:true},
   {c:"urgency",type:"choice",q:"How quickly do you need it to start generating meaningful revenue?",opts:["<3 months","3–6 months","6–12 months","12+ months","No urgency"],req:true},
   {c:"days",type:"choice",q:"How many days a week do you realistically want to work in the business?",opts:["1","2","3","4","5+"],req:true},
 ]},
 { title:"Expertise and transferable value", intro:"What you genuinely know, and why someone would value it.", items:[
   {s:"B1"},{s:"B2"},{s:"B3"},{s:"B4"},{s:"B5"},
   {c:"problems",type:"long",q:"List up to three problems you are unusually well equipped to solve."},
   {c:"evidence_expertise",type:"long",q:"What evidence, achievements, credentials or experience support this?"},
 ]},
 { title:"Customer and problem", intro:"Who would buy, and why they would care.", items:[
   {s:"C1"},{s:"C2"},{s:"C3"},{s:"C4"},{s:"C5"},{s:"C6"},
   {c:"customer",type:"long",q:"Describe the customer you currently have in mind."},
   {c:"do_nothing",type:"long",q:"What happens if they do nothing about the problem?"},
 ]},
 { title:"Evidence and validation", intro:"What has actually happened, as opposed to what you believe. Be honest here; it matters most.", items:[
   {s:"D1"},{s:"D2"},{s:"D3"},{s:"D4"},{s:"D5"},{s:"D6"},{s:"D7"},
   {c:"best_evidence",type:"long",q:"What is the strongest piece of evidence you currently have that somebody will pay?"},
 ]},
 { title:"Proposition and differentiation", intro:"How clearly your offer can be understood and bought.", items:[
   {s:"E1"},{s:"E2"},{s:"E3"},{s:"E4"},{s:"E5"},
   {c:"offer",type:"long",q:"Write your current offer in one sentence, even if it's rough."},
   {c:"different",type:"long",q:"What makes your approach different or particularly credible?"},
 ]},
 { title:"Commercial model and economics", intro:"Whether the numbers can work for the life you want.", items:[
   {s:"F1"},{s:"F2"},{s:"F3"},{s:"F4"},{s:"F5"},{s:"F6"},
   {c:"first_sale",type:"long",q:"What do you expect to sell first, and at what price?"},
   {c:"sales_needed",type:"text",q:"Roughly how many sales or clients a year would you need to reach your target income?",hint:"A number, or 'don't know'."},
 ]},
 { title:"Route to market and authority", intro:"How you'll reach and persuade the people you need.", items:[
   {s:"G1"},{s:"G2"},{s:"G3"},{s:"G4"},{s:"G5"},
   {c:"relationships",type:"choice",q:"Approximately how many relevant professional relationships could you contact personally?",opts:["0","1–10","11–30","31–100","100+"]},
   {c:"channels",type:"multi",q:"Which channels are most realistic for you?",opts:["Network","Partnerships","LinkedIn","Speaking","Outbound","Referrals","Paid","Other"]},
 ]},
 { title:"Practical and financial readiness", intro:"Time, runway and what you can afford to test.", items:[
   {s:"H1"},{s:"H2"},{s:"H3"},{s:"H4"},{s:"H5"},
   {c:"funding",type:"multi",q:"How do you expect to fund the start-up period?",opts:["Current income","Savings","Redundancy","Pension release","Partner or household income","Loan","Grant","Investment","Other"]},
   {c:"invest_max",type:"choice",q:"The most you'd be comfortable investing before seeing meaningful evidence of demand",opts:["Under £1k","£1k–£5k","£5k–£15k","£15k–£50k","£50k+"]},
 ]},
 { title:"Founder fit and commitment", intro:"Whether this business fits the life you actually want.", items:[
   {s:"I1"},{s:"I2"},{s:"I3"},{s:"I4"},
   {c:"success_beyond_money",type:"long",q:"What would make this next chapter feel successful, beyond the money?"},
   {c:"no_compromise",type:"long",q:"What are you least willing to compromise on?"},
 ]},
];

const KEY="encore-diagnostic-v1";
let A={}, step=0;
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s){A=s.A||{};step=s.step||0;}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({A,step}));}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app=document.getElementById("app");

function renderSection(){
  const S=SECTIONS[step], n=SECTIONS.length;
  let html=`<div class="progress"><div class="bar"><i style="width:${Math.round(step/n*100)}%"></i></div><span class="count">Section ${step+1} of ${n}</span></div>
  <div class="eyebrow red">Section ${step+1}</div><h2 class="sec">${esc(S.title)}</h2><p class="sec-intro">${esc(S.intro)}</p>`;
  if(S.items.some(i=>i.s)) html+=`<p class="note">For each statement: how true is this for you today? 0 means not at all, 4 means strongly, with clear evidence.</p>`;
  S.items.forEach(it=>{
    if(it.s){
      const v=A[it.s];
      html+=`<div class="q"><span class="qt" id="l-${it.s}">${esc(TEXT[it.s])}</span><div class="scale" role="radiogroup" aria-labelledby="l-${it.s}">${SCALE.map((l,i)=>`<button type="button" role="radio" aria-checked="${v===i}" data-s="${it.s}" data-v="${i}"><b>${i}</b>${l}</button>`).join("")}</div></div>`;
    } else if(it.type==="choice"||it.type==="multi"){
      const v=A[it.c]; const sel=o=>it.type==="multi"?(Array.isArray(v)&&v.includes(o)):v===o;
      html+=`<div class="q"><span class="qt">${esc(it.q)}${it.hint?`<span class="hint">${esc(it.hint)}</span>`:""}${it.type==="multi"?`<span class="hint">Choose any that apply.</span>`:""}</span><div class="choices">${it.opts.map(o=>`<button type="button" aria-pressed="${sel(o)}" data-c="${it.c}" data-o="${esc(o)}" data-m="${it.type==="multi"?1:0}">${esc(o)}</button>`).join("")}</div></div>`;
    } else {
      const id="f-"+it.c, val=esc(A[it.c]||"");
      html+=`<div class="q"><label class="qt" for="${id}">${esc(it.q)}${it.hint?`<span class="hint">${esc(it.hint)}</span>`:""}</label>${it.type==="long"?`<textarea id="${id}" data-c="${it.c}">${val}</textarea>`:`<input id="${id}" type="${it.type==="email"?"email":"text"}" data-c="${it.c}" value="${val}" ${it.type==="email"?'autocomplete="email"':it.c==="name"?'autocomplete="name"':""}>`}</div>`;
    }
  });
  html+=`<div class="err" id="err" role="alert"></div><div class="nav">${step>0?`<button class="btn btn-ghost" id="back">← Back</button>`:"<span></span>"}<button class="btn btn-red" id="next">${step===n-1?"Submit my diagnostic":"Next section"} →</button></div>`;
  app.innerHTML=html; window.scrollTo({top:0});
  app.querySelectorAll(".scale button").forEach(b=>b.onclick=()=>{A[b.dataset.s]=+b.dataset.v;save();b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-checked",x===b));});
  app.querySelectorAll(".choices button").forEach(b=>b.onclick=()=>{
    const c=b.dataset.c,o=b.dataset.o;
    if(b.dataset.m==="1"){const arr=Array.isArray(A[c])?A[c]:[];A[c]=arr.includes(o)?arr.filter(x=>x!==o):[...arr,o];b.setAttribute("aria-pressed",A[c].includes(o));}
    else{A[c]=o;b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));}
    save();
  });
  app.querySelectorAll("[data-c]").forEach(f=>{if(f.tagName!=="BUTTON") f.oninput=()=>{A[f.dataset.c]=f.value;save();};});
  const back=document.getElementById("back"); if(back) back.onclick=()=>{step--;save();renderSection();};
  document.getElementById("next").onclick=()=>{
    const missing=S.items.filter(it=>it.s?A[it.s]===undefined:(it.req&&!String(A[it.c]||"").trim()));
    const err=document.getElementById("err");
    if(missing.length){err.textContent=`Please answer all the statements${S.items.some(i=>i.req)?" and required questions":""} in this section before moving on (${missing.length} left).`;return;}
    if(S.items.some(i=>i.c==="email")&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(A.email||"")){err.textContent="Please enter a valid email address, for example jo@example.com.";return;}
    if(step<n-1){step++;save();renderSection();} else submit();
  };
}

async function submit(){
  const answers={}; QUESTIONS.forEach(q=>answers[q.code]=A[q.code]);
  const r=evaluate({answers,urgency:A.urgency});
  const context={}; SECTIONS.forEach(S=>S.items.forEach(it=>{if(it.c) context[it.c]=A[it.c];}));
  const f={"form-name":"encore-diagnostic","bot-field":"",name:A.name,email:A.email,proposed_business:A.building||"",
    verdict:r.verdict.label,overall:String(r.overall),
    dimension_scores:Object.keys(DIMENSIONS).map(k=>DIMENSIONS[k].name+": "+r.dimensions[k]).join("; "),
    gates:r.gates.join(", "),patterns:r.patterns.map(k=>k+" "+r.patternDetail[k].name).join("; "),
    answers_json:JSON.stringify(answers),context_answers:JSON.stringify(context)};
  const btn=document.getElementById("next"); btn.disabled=true; btn.textContent="Sending…";
  try{
    const res=await fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(f).toString()});
    if(!res.ok) throw new Error(res.status);
    try{localStorage.removeItem(KEY);}catch(e){}
    app.innerHTML=`<div class="done"><div class="eyebrow red">Diagnostic received</div><h2>Thank you, ${esc((A.name||"").split(" ")[0])}.</h2>
    <p>Your answers are in. Your Encore Verdict will arrive at <b>${esc(A.email)}</b> within five working days.</p>
    <p class="note">While you wait, there's one thing worth doing: write down the single assumption that, if it turned out to be wrong, would change your plan most. Your Verdict will tell you whether you picked the right one.</p></div>`;
    window.scrollTo({top:0});
  }catch(e){
    btn.disabled=false; btn.textContent="Try again →";
    document.getElementById("err").textContent="Your answers didn't send. Your progress is saved on this device; please check your connection and try again. If it keeps failing, email jo@theencorepartnership.com.";
  }
}
renderSection();
</script>
</body>
</html>
